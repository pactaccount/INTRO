<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">CiteCanvas Document Workspace</title>
  <desc id="d">Multimodal PDF workspace with coordinate bounding box citations and hybrid retrieval</desc>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07131b"/>
      <stop offset="100%" stop-color="#02080d"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f2d"/>
      <stop offset="100%" stop-color="#08141e"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1200" height="680" rx="24" fill="url(#cbg)"/>
  <rect x="25" y="25" width="1150" height="630" rx="18" fill="#08141f" stroke="#1e3a52" stroke-width="1.5"/>

  <!-- Top App Bar -->
  <rect x="25" y="25" width="1150" height="64" rx="18" fill="#0b1c2b" stroke="#1e3a52" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <circle cx="65" cy="57" r="16" fill="#0284c7"/>
  <path d="M57 57 L63 63 L73 51" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="63" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.02em">CiteCanvas</text>
  <rect x="220" y="47" width="92" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="232" y="62" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">WORKSPACE</text>

  <!-- Activity Tabs -->
  <rect x="360" y="42" width="105" height="32" rx="8" fill="#1e3a52"/>
  <text x="382" y="62" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Documents</text>
  <text x="495" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Ask a Question</text>
  <text x="625" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Build Table</text>
  <text x="735" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Compare Files</text>

  <!-- Right Status Badges -->
  <rect x="915" y="44" width="130" height="26" rx="6" fill="#071927" stroke="#1e3a52"/>
  <circle cx="930" cy="57" r="4" fill="#10b981"/>
  <text x="942" y="61" fill="#cbd5e1" font-family="monospace" font-size="11">0.073s Latency</text>
  <rect x="1055" y="43" width="100" height="28" rx="6" fill="url(#accentGlow)"/>
  <text x="1073" y="61" fill="#031525" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">+ Add PDF</text>

  <!-- Workspace Left Pane: PDF Viewer with Bounding Box Grounding -->
  <rect x="45" y="105" width="555" height="525" rx="12" fill="url(#cardBg)" stroke="#19334a"/>
  
  <!-- PDF Top Ribbon -->
  <rect x="45" y="105" width="555" height="42" rx="12" fill="#0a1926" stroke="#19334a"/>
  <text x="65" y="131" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Q3_Financial_Filing_Consolidated.pdf</text>
  <text x="470" y="131" fill="#38bdf8" font-family="monospace" font-size="11">PAGE 4 / 28</text>

  <!-- Rendered PDF Page Canvas -->
  <rect x="75" y="165" width="495" height="440" rx="6" fill="#ffffff" filter="drop-shadow(0px 8px 24px rgba(0,0,0,0.5))"/>
  
  <!-- Simulated Document Layout Lines -->
  <rect x="105" y="195" width="220" height="12" rx="3" fill="#1e293b"/>
  <rect x="105" y="218" width="435" height="7" rx="2" fill="#94a3b8"/>
  <rect x="105" y="233" width="400" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="105" y="248" width="425" height="7" rx="2" fill="#cbd5e1"/>

  <!-- High-Precision Bounding Box (Grounding Evidence) -->
  <rect x="100" y="275" width="445" height="135" rx="4" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 3"/>
  <rect x="100" y="275" width="135" height="18" rx="2" fill="#0284c7"/>
  <text x="106" y="288" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">GROUNDED EVIDENCE</text>

  <!-- Table inside Bounding Box -->
  <rect x="115" y="305" width="415" height="22" rx="3" fill="#f1f5f9"/>
  <text x="125" y="320" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700">Operating Metric</text>
  <text x="290" y="320" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700">Q3 2026</text>
  <text x="420" y="320" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="700">YoY Growth</text>
  <line x1="115" y1="334" x2="530" y2="334" stroke="#e2e8f0"/>
  <text x="125" y="352" fill="#334155" font-family="sans-serif" font-size="10">Cloud Platform Revenue</text>
  <text x="290" y="352" fill="#0369a1" font-family="monospace" font-size="10" font-weight="700">$4.12 Billion</text>
  <text x="420" y="352" fill="#15803d" font-family="monospace" font-size="10" font-weight="700">+34.8%</text>
  <line x1="115" y1="364" x2="530" y2="364" stroke="#e2e8f0"/>
  <text x="125" y="382" fill="#334155" font-family="sans-serif" font-size="10">Operating Income</text>
  <text x="290" y="382" fill="#0369a1" font-family="monospace" font-size="10" font-weight="700">$1.28 Billion</text>
  <text x="420" y="382" fill="#15803d" font-family="monospace" font-size="10" font-weight="700">+28.2%</text>

  <!-- Document Continuation -->
  <rect x="105" y="430" width="435" height="7" rx="2" fill="#94a3b8"/>
  <rect x="105" y="445" width="380" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="105" y="460" width="410" height="7" rx="2" fill="#cbd5e1"/>
  <rect x="105" y="475" width="290" height="7" rx="2" fill="#cbd5e1"/>

  <!-- Right Pane: Multimodal Analysis & Grounded Citations -->
  <rect x="620" y="105" width="535" height="525" rx="12" fill="url(#cardBg)" stroke="#19334a"/>
  
  <!-- Right Header -->
  <rect x="620" y="105" width="535" height="42" rx="12" fill="#0a1926" stroke="#19334a"/>
  <text x="640" y="131" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Multimodal Agent Grounding</text>
  <rect x="1010" y="113" width="130" height="26" rx="6" fill="#102a3d" stroke="#38bdf8"/>
  <text x="1025" y="130" fill="#38bdf8" font-family="monospace" font-size="11">NVIDIA VLM 2B</text>

  <!-- User Question Box -->
  <rect x="640" y="165" width="495" height="54" rx="8" fill="#0f2436" stroke="#254a68"/>
  <text x="655" y="186" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">QUERY</text>
  <text x="655" y="206" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="500">"What was the Cloud Platform Revenue in Q3 and YoY growth?"</text>

  <!-- Grounded Verification Card -->
  <rect x="640" y="235" width="495" height="235" rx="10" fill="#081824" stroke="#1d3d57"/>
  <rect x="655" y="250" width="150" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="665" y="265" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">VERIFIED ANSWER</text>
  <rect x="815" y="250" width="145" height="22" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8"/>
  <text x="825" y="265" fill="#38bdf8" font-family="monospace" font-size="11">Page 4 · Coords [100, 275]</text>

  <text x="655" y="300" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Cloud Platform Revenue was $4.12 Billion in Q3 2026.</text>
  <text x="655" y="325" fill="#cbd5e1" font-family="sans-serif" font-size="13" line-height="1.5">This represents a YoY expansion of +34.8% compared to the prior-year</text>
  <text x="655" y="347" fill="#cbd5e1" font-family="sans-serif" font-size="13">period, driven by increased enterprise multi-tenant adoption.</text>

  <!-- Architecture Metadata Chips -->
  <rect x="655" y="380" width="465" height="72" rx="8" fill="#0c1f2e" stroke="#183850"/>
  <text x="670" y="402" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="700">SYSTEM EVIDENCE LOG</text>
  <text x="670" y="423" fill="#94a3b8" font-family="monospace" font-size="11">• Fast Tier: 180-DPI rasterization (73 ms preview response)</text>
  <text x="670" y="441" fill="#94a3b8" font-family="monospace" font-size="11">• Lossless Tier: 300-DPI on-demand R2 verification · Qdrant filtered</text>

  <!-- Interactive Action Bar -->
  <rect x="640" y="490" width="495" height="54" rx="10" fill="#0d2334" stroke="#254d6e"/>
  <rect x="652" y="501" width="135" height="32" rx="6" fill="#0284c7"/>
  <text x="668" y="521" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Jump to Evidence</text>
  <rect x="797" y="501" width="125" height="32" rx="6" fill="#143147" stroke="#2a587d"/>
  <text x="815" y="521" fill="#e2e8f0" font-family="sans-serif" font-size="12">Export Citation</text>
  <text x="965" y="522" fill="#64748b" font-family="monospace" font-size="11">R2 Durable Object</text>

  <!-- Bottom Brand Footnote -->
  <text x="45" y="650" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="0.05em">CITECANVAS · 0.073S PREVIEW LATENCY · 91.6% RENDERING EFFICIENCY · LIVE AT CITECANVAS.ONRENDER.COM</text>
</svg>
